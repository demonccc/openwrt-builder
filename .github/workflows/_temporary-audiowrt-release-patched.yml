          python3 -m py_compile scripts/build.py tests/test_release_patched_boundary.py tests/test_release_patched_explicit_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Resolve builder image
        shell: bash
        run: |
          if docker pull demonccc/openwrt-builder:latest; then
            echo 'IMAGE=demonccc/openwrt-builder:latest' >> "$GITHUB_ENV"
          else
            docker build -t openwrt-builder:local .
            echo 'IMAGE=openwrt-builder:local' >> "$GITHUB_ENV"
          fi

      - name: Full Archer release-patched build
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE" \
            python3 scripts/build.py build \
              --profile archer-a9-v6-25.12.5 \
              --output artifact \
              --jobs 4 \
              --verbosity normal

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.py tests/test_release_patched_boundary.py tests/test_release_patched_explicit_boundary.py
          git commit -m 'fix: build release-patched package roots in official SDK'
          git push origin HEAD:fix/release-patched-sdk-kmod-abi
