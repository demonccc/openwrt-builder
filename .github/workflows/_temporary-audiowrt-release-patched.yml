name: Temporary AudioWRT-model release-patched validation

on:
  push:
    branches:
      - fix/release-patched-sdk-kmod-abi

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-patched-sdk-kmod-abi
          fetch-depth: 0

      - name: Apply AudioWRT SDK source-build model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build_path = Path('scripts/build.py')
          test_path = Path('tests/test_release_patched_boundary.py')
          explicit_path = Path('tests/test_release_patched_explicit_boundary.py')

          build = build_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')
          explicit = explicit_path.read_text(encoding='utf-8')

          # Add SDK source-root helpers immediately before parse_device_kernel_target.
          anchor = '\ndef parse_device_kernel_target(make_database, device):\n'
          helpers = r'''
def source_target_root(target):
    suffix = "/compile"
    if not target.endswith(suffix):
        raise BuilderError(f"Source build target must end in /compile: {target}")
    root = Path(target[:-len(suffix)])
    if root.is_absolute() or ".." in root.parts:
        raise BuilderError(f"Source build target must stay inside the OpenWrt tree: {target}")
    return root


def prepare_sdk_source_targets(source_dir, sdk_dir, targets, packages):
    """Register only explicit patched source roots in the exact-release SDK.

    This mirrors AudioWRT: the SDK is the package compilation environment, while
    unchanged runtime/kernel packages remain release binaries. Source definitions
    for dependencies may be installed, but only explicit targets are copied from
    the patched checkout and later collected as custom APKs.
    """
    if not sdk_dir:
        raise BuilderError("SDK source-target preparation requires an SDK")

    feeds_conf_default = sdk_dir / "feeds.conf.default"
    if feeds_conf_default.is_file():
        feeds_conf = sdk_dir / "feeds.conf"
        if not feeds_conf.is_file():
            shutil.copy2(feeds_conf_default, feeds_conf)
        run(["./scripts/feeds", "update", "base"], cwd=sdk_dir)
        # Install source definitions for the explicitly selected packages and
        # their source dependencies. This does not compile them.
        if packages:
            run(["./scripts/feeds", "install", *packages], cwd=sdk_dir)

    registered = []
    for target in targets:
        relative = source_target_root(target)
        source = source_dir / relative
        destination = sdk_dir / relative
        if not source.is_dir():
            raise BuilderError(f"Explicit source target directory is missing: {source}")
        replace_tree(source, destination)
        registered.append(str(relative))

    config = sdk_dir / ".config"
    existing = config.read_text(encoding="utf-8") if config.is_file() else ""
    package_set = set(packages)
    kept = []
    for raw in existing.splitlines():
        match = re.match(r"(?:# )?CONFIG_PACKAGE_([^= ]+)(?:=| is not set)", raw)
        if match and match.group(1) in package_set:
            continue
        kept.append(raw)
    kept.extend(f"CONFIG_PACKAGE_{package}=m" for package in packages)
    config.write_text("\n".join(kept) + "\n", encoding="utf-8")
    run(["make", "defconfig"], cwd=sdk_dir)
    return registered


def compile_sdk_source_targets(sdk_dir, targets, jobs):
    """Compile explicit source roots in the official SDK, with build deps enabled."""
    download_targets = [f"{source_target_root(target)}/download" for target in targets]
    if download_targets:
        run(["make", *download_targets, f"-j{jobs}"], cwd=sdk_dir)
    if targets:
        # Deliberately no NO_DEPS=1: this is the AudioWRT source-package path.
        # The SDK owns the dependency build/staging environment and preserves the
        # exact release kernel ABI. Only explicit target APKs are collected later.
        run(["make", *targets, f"-j{jobs}"], cwd=sdk_dir)

'''
          if anchor not in build:
              raise SystemExit('parse_device_kernel_target anchor not found')
          if 'def prepare_sdk_source_targets(' not in build:
