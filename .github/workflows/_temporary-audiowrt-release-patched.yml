          # only the device kernel image from the checkout, using official ABI.
          start = build.index('def prepare_device_kernel_artifact(')
          end = build.index('\ndef configure_download_cache(', start)
          new_device = r'''def prepare_device_kernel_artifact(source_dir, settings, jobs, official_ib=None):
    if official_ib is not None:
        # The checkout is used for target/device changes (for example DTS), not
        # as the package/kmod build environment. Prepare/configure just enough
        # of the kernel tree to build the device kernel image.
        run(["make", "target/linux/prepare", "NO_DEPS=1", f"-j{jobs}"], cwd=source_dir)
        linux_dir = resolve_linux_source_directory(source_dir, settings)
        target_dir = target_linux_directory(source_dir, settings)
        configured_stamp = linux_dir / ".configured"
        run(
            [
                "make",
                "-C",
                str(target_dir.relative_to(source_dir)),
                f"TOPDIR={source_dir.resolve()}",
                "TARGET_BUILD=1",
                str(configured_stamp),
                f"-j{jobs}",
            ],
            cwd=source_dir,
        )
        seed_official_kernel_abi(official_ib, source_dir, settings)

    image_dir = target_image_directory(source_dir, settings)
    target_dir = image_dir.parent
    topdir = source_dir.resolve()
    relative_image_dir = str(image_dir.relative_to(source_dir))
    relative_target_dir = str(target_dir.relative_to(source_dir))
    make_base = [
        "make",
        "-s",
        "-C",
        relative_image_dir,
        "--no-print-directory",
        f"TOPDIR={topdir}",
        "TARGET_BUILD=",
    ]
    database = subprocess.run(
        [*make_base, "-pn", "install"],
        cwd=source_dir,
        check=False,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        text=True,
    )
    if database.returncode:
        detail = database.stderr.strip().splitlines()
        suffix = f": {detail[-1]}" if detail else ""
        raise BuilderError(f"Could not inspect OpenWrt image make database{suffix}")
    kernel_target = parse_device_kernel_target(database.stdout, settings["DEVICE"])
    kernel_image_stamp = resolve_kernel_image_stamp(kernel_target)

    image_command = [
        "make",
        "-C",
        relative_target_dir,
        f"TOPDIR={topdir}",
        "TARGET_BUILD=1",
    ]
    if official_ib is not None:
        # Keep generated Kconfig headers synchronized with the official effective
        # config without rerunning OpenWrt's full configure recipe/.config.set.
        image_command.append("Kernel/Configure=$(KERNEL_MAKE) olddefconfig")
    image_command.extend([str(kernel_image_stamp), f"-j{jobs}"])
    run(image_command, cwd=source_dir)
    if not kernel_image_stamp.is_file():
        raise BuilderError(f"Generic kernel image stamp was not generated: {kernel_image_stamp}")

    run(
        [
            "make",
            "-C",
            relative_image_dir,
            f"TOPDIR={topdir}",
            "TARGET_BUILD=",
            "kernel_prepare",
            f"-j{jobs}",
        ],
        cwd=source_dir,
    )
    run(
        [
            "make",
            "-C",
            relative_image_dir,
            f"TOPDIR={topdir}",
            "TARGET_BUILD=",
            str(kernel_target),
            f"-j{jobs}",
        ],
        cwd=source_dir,
    )
    if not kernel_target.is_file():
        raise BuilderError(f"Device kernel artifact was not generated: {kernel_target}")
    print(f"Device kernel artifact: {kernel_target}", flush=True)
    return kernel_target

'''
          build = build[:start] + new_device + build[end+1:]

          # Seed exact official kernel package/version as well as userspace base.
          old_wanted = '''    wanted = {\n        "BASE_FILES_VERSION": "base-files.version",\n        "LIBC_VERSION": "libc.version",\n    }'''
          new_wanted = '''    wanted = {\n        "BASE_FILES_VERSION": "base-files.version",\n        "LIBC_VERSION": "libc.version",\n        "KERNEL_VERSION": "kernel.version",\n    }'''
