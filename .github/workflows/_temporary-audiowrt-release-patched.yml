name: Temporary AudioWRT-model release-patched validation

on:
  push:
    branches:
      - fix/release-patched-sdk-kmod-abi

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-patched-sdk-kmod-abi
          fetch-depth: 0

      - name: Apply patch and run tests
        run: |
          python3 .github/_temporary_patch_release.py
          python3 .github/_temporary_patch_tests.py
          python3 -m py_compile scripts/build.py tests/test_build.py tests/test_release_patched_boundary.py tests/test_release_patched_explicit_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Resolve builder image
        run: |
          if docker pull demonccc/openwrt-builder:latest; then
            echo 'IMAGE=demonccc/openwrt-builder:latest' >> "$GITHUB_ENV"
          else
            docker build -t openwrt-builder:local .
            echo 'IMAGE=openwrt-builder:local' >> "$GITHUB_ENV"
          fi

      - name: Full Archer release-patched build
        id: full_build
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE" \
            python3 scripts/build.py build \
              --profile archer-a9-v6-25.12.5 \
              --output artifact \
              --jobs 4 \
              --verbosity normal 2>&1 | tee .github/_last_archer_build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit failing log
        if: steps.full_build.outputs.status != '0'
        run: |
          tail -n 1200 .github/_last_archer_build.log > .github/_last_archer_build.tail.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/_last_archer_build.tail.log
          git commit -m 'chore: capture Archer validation failure'
          git push origin HEAD:fix/release-patched-sdk-kmod-abi
          exit 1

      - name: Commit verified fix
        if: steps.full_build.outputs.status == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.py tests/test_build.py tests/test_release_patched_boundary.py tests/test_release_patched_explicit_boundary.py
          git commit -m 'fix: build release-patched package roots in official SDK'
          git push origin HEAD:fix/release-patched-sdk-kmod-abi
