name: Temporary consolidate builder

on:
  push:
    branches:
      - fix/cleanup-release-patched-dispatch

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cleanup-release-patched-dispatch
          fetch-depth: 0

      - name: Consolidate builder implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper_path = Path('scripts/build.py')
          core_path = Path('scripts/build_core.py')
          tests_path = Path('tests/test_build.py')

          wrapper = wrapper_path.read_text(encoding='utf-8')
          core = core_path.read_text(encoding='utf-8')

          # Preserve the corrected release-patched implementation from build.py.
          w_start = wrapper.index('def build_release_patched(')
          w_end = wrapper.index('\ndef _bind_release_patched_dispatch', w_start)
          release_patched = wrapper[w_start:w_end].rstrip() + '\n\n'

          # Remove the obsolete selected-kmod -> source-target expansion helpers.
          s_start = core.index('def selected_kernel_packages(')
          s_end = core.index('\ndef package_metadata(', s_start)
          core = core[:s_start] + core[s_end + 1:]

          r_start = core.index('def resolve_kernel_build_targets(')
          r_end = core.index('\ndef resolve_selected_packages_for_targets(', r_start)
          core = core[:r_start] + core[r_end + 1:]

          # Replace the old release-patched implementation with the canonical one.
          b_start = core.index('def build_release_patched(')
          b_end = core.index('\ndef build_imagebuilder(', b_start)
          core = core[:b_start] + release_patched + core[b_end + 1:]

          wrapper_path.write_text(core, encoding='utf-8')
          core_path.unlink()

          # The removed resolver must not retain tests that encode the old behavior.
          tests = tests_path.read_text(encoding='utf-8')
          t_start = tests.index('class KernelTargetResolutionTests(')
          t_end = tests.index('\nclass DeviceKernelResolutionTests(', t_start)
          tests = tests[:t_start] + tests[t_end + 1:]
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 -m py_compile scripts/build.py tests/test_build.py tests/test_release_patched_explicit_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: consolidate builder into one implementation'
          git push origin HEAD:fix/cleanup-release-patched-dispatch
