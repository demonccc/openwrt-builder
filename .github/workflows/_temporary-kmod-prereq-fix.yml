name: Temporary kmod prerequisite fix

on:
  push:
    branches:
      - fix/release-patched-kmod-prerequisites

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-patched-kmod-prerequisites
          fetch-depth: 0

      - name: Patch release-patched kmod prerequisites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          build_path = Path('scripts/build.py')
          tests_path = Path('tests/test_release_patched_boundary.py')
          build = build_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          anchor = 'def target_image_directory(source_dir, settings):\n'
          helpers = dedent(r'''
          def normalize_package_dependency(token):
              token = token.strip()
              if not token or token.startswith("@"):
                  return None
              token = token.lstrip("+")
              if ":" in token:
                  token = token.rsplit(":", 1)[1]
              token = token.split("(", 1)[0].strip()
              if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9+_.-]*", token):
                  return token
              return None


          def package_build_metadata(source_dir):
              records = {}
              current_target = None
              current_package = None
              for raw in package_metadata(source_dir).read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if line.startswith("Source-Makefile:"):
                      makefile = line.split(":", 1)[1].strip()
                      current_target = (
                          f"{makefile[:-len('/Makefile')]}/compile"
                          if makefile.endswith("/Makefile")
                          else None
                      )
                      current_package = None
                  elif line.startswith("Package:"):
                      current_package = line.split(":", 1)[1].strip()
                      records[current_package] = {"target": current_target, "depends": []}
                  elif line.startswith("Depends:") and current_package:
                      dependencies = []
                      for token in line.split(":", 1)[1].split():
                          package = normalize_package_dependency(token)
                          if package and package not in dependencies:
                              dependencies.append(package)
                      records[current_package]["depends"] = dependencies
              return records


          def resolve_external_kmod_prerequisites(source_dir, root_packages, explicit_targets):
              records = package_build_metadata(source_dir)
              explicit_targets = set(explicit_targets)
              queue = list(root_packages)
              seen = set(queue)
              prerequisites = {}

              while queue:
                  package = queue.pop(0)
                  record = records.get(package)
                  if not record:
                      continue
                  for dependency in record["depends"]:
                      if not dependency.startswith("kmod-") or dependency in seen:
                          continue
                      seen.add(dependency)
                      queue.append(dependency)
                      dependency_record = records.get(dependency)
                      if not dependency_record:
                          continue
                      target = dependency_record["target"]
                      if target and target not in explicit_targets:
                          packages = prerequisites.setdefault(target, [])
                          if dependency not in packages:
                              packages.append(dependency)
              return prerequisites


          def compile_package_prerequisites(source_dir, prerequisites, jobs):
              if not prerequisites:
                  return
              records = package_build_metadata(source_dir)
              selected = set(selected_package_names(source_dir))
              for target, required_packages in prerequisites.items():
                  required = set(required_packages)
                  selected_from_target = [
                      package
                      for package, record in records.items()
                      if record["target"] == target and package in selected
                  ]
                  overrides = [
                      f"CONFIG_PACKAGE_{package}=n"
                      for package in selected_from_target
                      if package not in required
                  ]
                  overrides.extend(
                      f"CONFIG_PACKAGE_{package}=y" for package in required_packages
                  )
                  print(
                      f"Preparing kernel package prerequisites from {target}: "
                      + ", ".join(required_packages),
                      flush=True,
                  )
                  run(
                      ["make", target, *overrides, "NO_DEPS=1", f"-j{jobs}"],
                      cwd=source_dir,
                  )


          ''').lstrip()
          if 'def resolve_external_kmod_prerequisites(' not in build:
              build = build.replace(anchor, helpers + anchor, 1)

          old = '    explicit_packages = resolve_selected_packages_for_targets(source_dir, targets)\n\n    if sdk:\n'
          new = '    explicit_packages = resolve_selected_packages_for_targets(source_dir, targets)\n    kmod_prerequisites = resolve_external_kmod_prerequisites(\n        source_dir, explicit_packages, targets\n    )\n\n    if sdk:\n'
          if old not in build:
              raise SystemExit('Could not find explicit_packages insertion point')
          build = build.replace(old, new, 1)

          old = '    compile_kernel_modules(source_dir, settings, jobs)\n    compile_without_dependencies(source_dir, targets, jobs)\n'
          new = '    compile_kernel_modules(source_dir, settings, jobs)\n    # External in-tree kmods required by the patched package roots must be\n    # staged before package dependency validation. Build only those prerequisite\n    # subpackages; they remain official BASE_REF APKs in the final ImageBuilder.\n    compile_package_prerequisites(source_dir, kmod_prerequisites, jobs)\n    compile_without_dependencies(source_dir, targets, jobs)\n'
          if old not in build:
              raise SystemExit('Could not find compile insertion point')
          build = build.replace(old, new, 1)

          old = '        f"SOURCE_BUILD_PACKAGES={\' \'.join(explicit_packages)}",\n        "KMOD_POLICY=official-base-unless-explicit-source-target",\n'
          new = '        f"SOURCE_BUILD_PACKAGES={\' \'.join(explicit_packages)}",\n        "KMOD_BUILD_PREREQUISITES=" + " ".join(\n            f"{target}={\',\'.join(packages)}"\n            for target, packages in kmod_prerequisites.items()\n        ),\n        "KMOD_POLICY=official-base-unless-explicit-source-target",\n'
          if old not in build:
              raise SystemExit('Could not find BUILD_INFO insertion point')
          build = build.replace(old, new, 1)

          test_anchor = '\n\nif __name__ == "__main__":\n'
          test_methods = dedent(r'''
              def test_resolves_only_external_kmod_prerequisites_for_explicit_roots(self):
                  temp = tempfile.TemporaryDirectory()
                  self.addCleanup(temp.cleanup)
                  source = Path(temp.name)
                  (source / ".config").write_text(
                      """CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_kmod-ath9k-common=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-random-core=y
          CONFIG_PACKAGE_kmod-usb-core=y
          """,
                      encoding="utf-8",
                  )
                  (source / "tmp").mkdir()
                  (source / "tmp" / ".packageinfo").write_text(
                      """Source-Makefile: package/kernel/mac80211/Makefile
          Package: kmod-ath9k
          Depends: +kmod-ath9k-common
          Package: kmod-ath9k-common
          Depends: +kmod-ath +kmod-random-core
          Package: kmod-ath
          Depends: +kmod-mac80211
          Package: kmod-mac80211
          Source-Makefile: package/kernel/linux/Makefile
          Package: kmod-random-core
          Package: kmod-usb-core
          """,
                      encoding="utf-8",
                  )
                  prerequisites = BUILDER.resolve_external_kmod_prerequisites(
                      source,
                      ["kmod-ath9k", "kmod-ath9k-common", "kmod-ath", "kmod-mac80211"],
                      ["package/kernel/mac80211/compile"],
                  )
                  self.assertEqual(
                      prerequisites,
                      {"package/kernel/linux/compile": ["kmod-random-core"]},
                  )

              def test_prerequisite_compile_disables_unrelated_selected_packages(self):
                  temp = tempfile.TemporaryDirectory()
                  self.addCleanup(temp.cleanup)
                  source = Path(temp.name)
                  (source / ".config").write_text(
                      """CONFIG_PACKAGE_kmod-random-core=y
          CONFIG_PACKAGE_kmod-usb-core=y
          """,
                      encoding="utf-8",
                  )
                  (source / "tmp").mkdir()
                  (source / "tmp" / ".packageinfo").write_text(
                      """Source-Makefile: package/kernel/linux/Makefile
          Package: kmod-random-core
          Package: kmod-usb-core
          """,
                      encoding="utf-8",
                  )
                  commands = []

                  def fake_run(command, *, cwd=None, check=True):
                      commands.append((list(command), cwd))
                      return SimpleNamespace(returncode=0)

                  with patch.object(BUILDER, "run", side_effect=fake_run):
                      BUILDER.compile_package_prerequisites(
                          source,
                          {"package/kernel/linux/compile": ["kmod-random-core"]},
                          4,
                      )

                  self.assertEqual(len(commands), 1)
                  command, cwd = commands[0]
                  self.assertEqual(cwd, source)
                  self.assertIn("package/kernel/linux/compile", command)
                  self.assertIn("CONFIG_PACKAGE_kmod-random-core=y", command)
                  self.assertIn("CONFIG_PACKAGE_kmod-usb-core=n", command)
                  self.assertIn("NO_DEPS=1", command)
                  self.assertNotIn("package/feeds/routing/batman-adv/compile", command)
          ''').rstrip() + '\n'
          test_methods = '\n'.join('    ' + line if line else '' for line in test_methods.splitlines()) + '\n'
          if 'test_resolves_only_external_kmod_prerequisites_for_explicit_roots' not in tests:
              tests = tests.replace(test_anchor, '\n' + test_methods + test_anchor, 1)

          build_path.write_text(build, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 -m py_compile scripts/build.py tests/test_release_patched_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.py tests/test_release_patched_boundary.py
          git commit -m 'fix: stage explicit kernel package prerequisites'
          git push origin HEAD:fix/release-patched-kmod-prerequisites
