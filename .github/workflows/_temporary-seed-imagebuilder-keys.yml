name: Temporary seed ImageBuilder keys

on:
  push:
    branches:
      - fix/release-patched-imagebuilder-keys

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-patched-imagebuilder-keys
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_imagebuilder_keys.py

      - name: Run tests
        run: |
          python3 -m py_compile scripts/build.py tests/test_release_patched_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.py tests/test_release_patched_boundary.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: seed official APK keys for generated ImageBuilder'
          git push origin HEAD:fix/release-patched-imagebuilder-keys
