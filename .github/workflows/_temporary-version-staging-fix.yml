name: Temporary ImageBuilder version staging fix

on:
  push:
    branches:
      - fix/release-patched-imagebuilder-version-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-patched-imagebuilder-version-staging
          fetch-depth: 0

      - name: Patch ImageBuilder version staging path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path('scripts/build.py')
          tests_path = Path('tests/test_release_patched_boundary.py')
          build = build_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          old = '''def seed_official_imagebuilder_versions(official_ib, source_dir):\n    version_mk = official_ib / "include" / "version.mk"\n'''
          new = '''def seed_official_imagebuilder_versions(official_ib, source_dir, settings):\n    version_mk = official_ib / "include" / "version.mk"\n'''
          if old not in build:
              raise SystemExit('version helper signature anchor not found')
          build = build.replace(old, new, 1)

          old = '''    staging_dir = source_dir / "staging_dir"\n    staging_dir.mkdir(parents=True, exist_ok=True)\n    written = {}\n'''
          new = '''    target_roots = [\n        root\n        for root in source_dir.glob("staging_dir/target-*/root-*")\n        if root.name == f"root-{settings['TARGET']}"\n    ]\n    if len(target_roots) != 1:\n        raise BuilderError(\n            f"Expected one staging root for target {settings['TARGET']}, found {len(target_roots)}"\n        )\n    staging_dir = target_roots[0].parent\n    written = {}\n'''
          if old not in build:
              raise SystemExit('staging dir anchor not found')
          build = build.replace(old, new, 1)

          old = '''    official_versions = seed_official_imagebuilder_versions(\n        official_ib, source_dir\n    )\n'''
          new = '''    official_versions = seed_official_imagebuilder_versions(\n        official_ib, source_dir, settings\n    )\n'''
          if old not in build:
              raise SystemExit('version helper call anchor not found')
          build = build.replace(old, new, 1)

          tests = tests.replace(
              'BUILDER.seed_official_imagebuilder_versions(official_ib, source)',
              'BUILDER.seed_official_imagebuilder_versions(official_ib, source, {"TARGET": "ath79"})'
          )
          tests = tests.replace(
              '(source / "staging_dir").mkdir(parents=True, exist_ok=True)',
              '(source / "staging_dir" / "target-mips_24kc_musl" / "root-ath79").mkdir(parents=True, exist_ok=True)'
          )
          tests = tests.replace(
              'source / "staging_dir" / "base-files.version"',
              'source / "staging_dir" / "target-mips_24kc_musl" / "base-files.version"'
          )
          tests = tests.replace(
              'source / "staging_dir" / "libc.version"',
              'source / "staging_dir" / "target-mips_24kc_musl" / "libc.version"'
          )

          build_path.write_text(build, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 -m py_compile scripts/build.py tests/test_release_patched_boundary.py
          python3 -m unittest discover -s tests -v

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.py tests/test_release_patched_boundary.py
          git commit -m 'fix: seed ImageBuilder versions in target staging dir'
          git push origin HEAD:fix/release-patched-imagebuilder-version-staging
