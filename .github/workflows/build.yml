name: Build OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile directory name under profiles/
        required: true
        default: openwrt-25.12-source
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Detect source build
        id: profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          settings="profiles/${PROFILE}/settings"
          test -f "$settings"
          method="$(sed -n 's/^[[:space:]]*METHOD[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*/\1/p' "$settings" | head -n1)"
          echo "method=$method" >> "$GITHUB_OUTPUT"

      - name: Free disk space for source build
        if: ${{ steps.profile.outputs.method == 'source' }}
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Build builder image
        run: docker build -t openwrt-builder .

      - name: Build firmware
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openwrt-builder build \
            --profile "$PROFILE" \
            --output artifact \
            --jobs "$(nproc)"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.profile }}-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          tag="${PROFILE}-$(date -u +'%Y.%m.%d-%H%M')-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" artifact/* \
            --title "OpenWrt ${PROFILE}" \
            --notes-file artifact/BUILD_INFO
