name: Build OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Versioned profile under profiles/
        required: true
        default: archer-a9-v6-25.12.5
        type: choice
        options:
          # BEGIN GENERATED PROFILE OPTIONS
          - archer-a9-v6-25.12
          - archer-a9-v6-25.12.5
          - archer-a9-v6-25.12.6
          - linksys-velop-whw03-v2-25.12.5
          - linksys-velop-whw03-v2-25.12.6
          - x86-64-24.10.5
          - x86-64-25.12.5
          - x86-64-25.12.6
          - x86-64-snapshot
          # END GENERATED PROFILE OPTIONS
      builder_image:
        description: Docker image used as the OpenWrt build environment
        required: true
        default: demonccc/openwrt-builder:latest
        type: string
      verbosity:
        description: Build log detail level
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.builder_image }}
      options: --user root
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Detect source build
        id: profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          settings="profiles/${PROFILE}/settings"
          test -f "$settings"
          method="$(sed -n 's/^[[:space:]]*METHOD[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*/\1/p' "$settings" | head -n1)"
          echo "method=$method" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          PROFILE: ${{ inputs.profile }}
          VERBOSITY: ${{ inputs.verbosity }}
        run: |
          python3 scripts/build.py build \
            --profile "$PROFILE" \
            --output artifact \
            --jobs "$(nproc)" \
            --verbosity "$VERBOSITY"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.profile }}-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="${PROFILE}-$(date -u +'%Y.%m.%d-%H%M')-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" artifact/* \
            --title "OpenWrt ${PROFILE}" \
            --notes-file artifact/BUILD_INFO
