name: Sync build profile options

on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'scripts/validate-profile-catalog.py'
      - 'scripts/sync-profile-workflow.py'
      - '.github/workflows/sync-profile-options.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-build-profile-options
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate and regenerate dropdown
        run: |
          python3 scripts/validate-profile-catalog.py
          python3 scripts/sync-profile-workflow.py
          python3 scripts/sync-profile-workflow.py --check

      - name: Verify generated options are committed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/build.yml; then
            echo 'Profile options are current.'
            exit 0
          fi
          echo '::error::Generated profile options are stale. Run scripts/sync-profile-workflow.py and commit .github/workflows/build.yml.'
          git diff -- .github/workflows/build.yml
          exit 1
