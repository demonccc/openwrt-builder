name: Validate profiles

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:
    inputs:
      builder_image:
        description: Docker image used as the OpenWrt build environment
        required: true
        default: demonccc/openwrt-builder:latest
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      BUILDER_IMAGE: ${{ inputs.builder_image || 'demonccc/openwrt-builder:latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve builder image
        id: builder
        run: |
          if docker pull "$BUILDER_IMAGE"; then
            echo "image=$BUILDER_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "Published builder image unavailable; building Dockerfile locally as fallback."
            docker build -t openwrt-builder:local .
            echo "image=openwrt-builder:local" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate builder and profiles
        env:
          IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE" \
            python3 -m py_compile scripts/build.py tests/test_build.py

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE" \
            python3 -m unittest discover -s tests -v

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$IMAGE" \
            python3 scripts/build.py validate
